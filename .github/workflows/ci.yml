name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Bootstrap debt: generate and commit package-lock.json, then use npm ci.
      - run: npm install --package-lock=false
      - run: npm run check
      - run: npm run lint
      - run: npm run doctor
      - run: npm run bundle:shift
      - run: npm run bundle:portfolio
